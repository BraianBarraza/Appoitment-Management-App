name: Keep Render and Mongo Awake

on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Ping backend endpoint
        run: |
          status_code=$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" \
            --header "Origin: https://appointments-management-app.netlify.app" \
            https://appoitment-management-app.onrender.com/api/services)

          echo "Backend responded with HTTP $status_code"

          if [ "$status_code" -ne 200 ]; then
            echo "Keep-awake request failed"
            exit 1
          fi
