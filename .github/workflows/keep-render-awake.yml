name: Keep Render Awake

on:
  schedule:
    - cron: "7/10 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Ping health endpoint
        run: |
          status_code=$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" \
            --header "Origin: https://appointments.braianbarraza.com" \
            https://appoitment-management-app.onrender.com/api/health)

          echo "Backend responded with HTTP $status_code"

          if [ "$status_code" -ne 200 ]; then
            echo "Keep-awake request failed"
            exit 1
          fi
